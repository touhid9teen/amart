<svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Basket handle left -->
  <path d="M6 10C6 6 8 3 12 3C16 3 18 6 18 10" stroke="#4b8106" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Basket main body (wider at top) -->
  <path d="M5 10H19C19.5 10 20 10.5 20 11V18C20 19.5 19 21 17 21H7C5 21 4 19.5 4 18V11C4 10.5 4.5 10 5 10Z" stroke="#4b8106" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Basket weave/grid pattern -->
  <line x1="8" y1="10" x2="8" y2="21" stroke="#4b8106" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="12" y1="10" x2="12" y2="21" stroke="#4b8106" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="16" y1="10" x2="16" y2="21" stroke="#4b8106" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Horizontal weave lines -->
  <line x1="5" y1="14" x2="19" y2="14" stroke="#4b8106" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="5" y1="18" x2="19" y2="18" stroke="#4b8106" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Items in basket - stylized vegetables/products -->
  <!-- Item 1 - circle (apple/tomato) -->
  <circle cx="8" cy="13" r="2" fill="#4b8106" opacity="0.7"/>
  
  <!-- Item 2 - circle (apple/tomato) -->
  <circle cx="13" cy="12" r="2" fill="#4b8106" opacity="0.7"/>
  
  <!-- Item 3 - rectangle (box/package) -->
  <rect x="15.5" y="11" width="2.5" height="2.5" rx="0.5" fill="#4b8106" opacity="0.7"/>
</svg>
